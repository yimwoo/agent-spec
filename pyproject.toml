[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentspec"
version = "0.1.43"
description = "Design-to-agent workspace compiler and control plane for code agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aspec = "agentspec.cli:main"
agentspec = "agentspec.cli:main"

[tool.setuptools.packages.find]
include = ["agentspec*"]
exclude = ["tests*"]

[tool.mypy]
python_version = "3.11"
files = ["agentspec"]
follow_imports = "skip"
show_error_codes = true
warn_unused_ignores = true

[tool.pylint.format]
max-line-length = 180

[tool.pylint.messages_control]
disable = [
    "broad-exception-caught",
    "cyclic-import",
    "duplicate-code",
    "import-outside-toplevel",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
    "unused-argument",
]
