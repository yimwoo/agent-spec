[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentspec"
version = "0.1.14"
description = "Design-to-agent workspace compiler and control plane for code agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aspec = "agentspec.cli:main"
agentspec = "agentspec.cli:main"

[tool.setuptools.packages.find]
include = ["agentspec*"]
exclude = ["tests*"]
